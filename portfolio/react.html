<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yash Agarwal Media Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Searchable library of every reel, video, photo and graphic by Yash Agarwal. Built with React.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: an app. Sticky profile sidebar on the left, filter bar + media grid on the right. */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --text: #15171c;
  --muted: #626776;
  --line: #e1e3e8;
  --accent: #e8462b;      /* tomato red */
  --on-accent: #ffffff;
  --chip: #eceef2;
  --f-head: "Space Grotesk", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a20; --text: #eceef3; --muted: #9aa0ad; --line: #272b33;
    --accent: #ff6a4d; --on-accent: #1a0a06; --chip: #20242c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a20; --text: #eceef3; --muted: #9aa0ad; --line: #272b33;
  --accent: #ff6a4d; --on-accent: #1a0a06; --chip: #20242c; color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--f-body); }
img, video { max-width: 100%; display: block; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.1; text-wrap: balance; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; max-width: 1480px; margin-inline: auto;
  padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; display: grid; gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.avatar { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 22px var(--f-head); }
.side h1 { font-size: 26px; margin-top: 12px; }
.side .role { color: var(--muted); font-size: 14px; margin-top: 6px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.kpi { background: var(--chip); border-radius: 10px; padding: 10px; }
.kpi b { font: 700 20px var(--f-head); display: block; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.contact { display: grid; gap: 8px; }
.contact .c { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; }
.contact .c small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.contact .c b { font-weight: 600; overflow-wrap: anywhere; user-select: all; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; text-decoration: none; }
.mini.hot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.clients { display: grid; gap: 2px; max-height: 340px; overflow: auto; }
.clients button { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px; font-size: 14px; }
.clients button span { color: var(--muted); font-variant-numeric: tabular-nums; }
.clients button.on { background: var(--accent); color: var(--on-accent); }
.clients button.on span { color: var(--on-accent); }
.clients button:not(.on):hover { background: var(--chip); }
.side h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; font-family: var(--f-body); font-weight: 600; }

.main { min-width: 0; display: grid; gap: 16px; align-content: start; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 10px; padding: 0 12px; }
.search input { border: 0; background: transparent; outline: none; padding: 10px 0; width: 100%; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.bar select { background: var(--chip); border: 0; border-radius: 10px; padding: 9px 10px; }
.icon { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.status { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.status .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); color: var(--text); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
.status .pill button { border: 0; background: var(--panel); border-radius: 999px; width: 22px; height: 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 180px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-align: left; padding: 0; display: grid; transition: transform .15s, border-color .15s; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.thumb { position: relative; aspect-ratio: 4 / 5; max-width: 100%; background: var(--chip); }
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
.badge.video { background: var(--accent); color: var(--on-accent); }
.meta { padding: 10px 12px 12px; display: grid; gap: 2px; }
.meta b { font-size: 14px; font-weight: 600; line-height: 1.3; }
.meta span { font-size: 12px; color: var(--muted); }
.empty { text-align: center; padding: 60px 16px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; }
.loadmore { justify-self: center; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 10px 20px; font-weight: 600; }

.lb { position: fixed; inset: 0; z-index: 100; background: rgba(8, 9, 12, .94); color: #f2f3f5; display: grid; grid-template-columns: minmax(0, 1fr) 320px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 16px; }
.lb .stage { position: relative; display: grid; place-items: center; min-height: 0; }
.lb .stage img, .lb .stage video { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 12px; background: #000; }
.lb aside { background: #16181d; border-radius: 14px; padding: 18px; display: grid; gap: 10px; align-content: start; overflow: auto; }
.lb aside h3 { font-size: 20px; }
.lb aside .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9aa0ad; }
.lb button.nav, .lb button.x { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font-size: 20px; }
.lb button.nav.l { left: 0; top: 50%; transform: translateY(-50%); }
.lb button.nav.r { right: 0; top: 50%; transform: translateY(-50%); }
.lb button.x { right: 0; top: 0; }
.lb .lbtn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; background: var(--accent); color: var(--on-accent); text-align: center; text-decoration: none; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; z-index: 200; }
.boot { padding: 40px 16px; text-align: center; color: var(--muted); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; }
  .clients { max-height: none; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lb { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .lb aside { max-height: 34vh; }
}
@media (max-width: 480px) {
  .grid { --cell: 140px !important; }
  .clients { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"><p class="boot">Loading the media library…</p></div>
<noscript><p class="boot">This version needs JavaScript. Open cinematic.html or editorial.html instead.</p></noscript>

<!-- React 18 + htm, vendored so the page also works offline -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="react-app.js"></script>
</body>
</html>
