<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pepsi 3D Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #020823; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    background: rgba(2, 8, 35, .65); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; color: #fff; font-size: 13px; backdrop-filter: blur(6px);
    width: min(640px, calc(100vw - 32px)); box-sizing: border-box;
  }
  #ui button {
    background: #1a3fd6; color: #fff; border: 0; border-radius: 8px;
    padding: 7px 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  #ui button.rec { background: #e4002b; }
  #ui input[type=range] { flex: 1; min-width: 60px; accent-color: #e4002b; }
  #time { font-variant-numeric: tabular-nums; width: 44px; text-align: right; }
  body.render #ui { display: none; }
</style>

<!--
  three.js CDN से लोड होता है। ऑफ़लाइन चलाना हो तो `npm install three@0.160.0` करें
  और नीचे के URL को "./node_modules/three/build/three.module.js" और
  "./node_modules/three/examples/jsm/" से बदल दें।
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="play">⏸ Pause</button>
  <button id="replay">↺ Replay</button>
  <input id="scrub" type="range" min="0" max="12" step="0.01" value="0" />
  <span id="time">0.00</span>
  <button id="record" class="rec">⏺ Record</button>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   सेटिंग्स
   ============================================================ */
const DURATION = 12;          // वीडियो की लंबाई (सेकंड)
const T_POP    = 3.8;         // ढक्कन उछलने का समय
const params   = new URLSearchParams(location.search);
const RENDER_MODE = params.has('render');   // ?render=1 → फ्रेम-बाय-फ्रेम वीडियो रेंडर
if (RENDER_MODE) document.body.classList.add('render');

const FONT = '"Impact", "Arial Black", "Liberation Sans", Arial, sans-serif';
const BLUE = 0x0033c8, RED = 0xe4002b;

/* ---------- छोटे-छोटे हेल्पर ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const range = (t, a, b) => clamp((t - a) / (b - a));
const lerp  = (a, b, k) => a + (b - a) * k;
const easeOutCubic   = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack    = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) {             // हर बार एक जैसा "random" → वीडियो रेंडर स्थिर रहता है
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ============================================================
   रेंडरर, सीन, कैमरा
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER_MODE ? 1 : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.05, 200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* बैकग्राउंड: गहरे नीले रंग का रेडियल ग्रेडिएंट */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
scene.background = canvasTex(1024, 1024, (g, w, h) => {
  const gr = g.createRadialGradient(w * .5, h * .42, 0, w * .5, h * .5, w * .72);
  gr.addColorStop(0, '#1d55e6'); gr.addColorStop(.45, '#0a2a9a'); gr.addColorStop(1, '#010518');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

/* लाइटें: सामने की की-लाइट + लाल/नीली रिम लाइट (मोशन-ग्राफ़िक लुक) */
scene.add(new THREE.AmbientLight(0x6688ff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 6, 6); scene.add(key);
const rimRed  = new THREE.PointLight(RED, 60, 30);   rimRed.position.set(-4, 4, -3);  scene.add(rimRed);
const rimBlue = new THREE.PointLight(0x3d8bff, 70, 30); rimBlue.position.set(4, 3, -3); scene.add(rimBlue);
const top = new THREE.SpotLight(0xffffff, 45, 20, 0.5, 0.6); top.position.set(0, 10, 2); scene.add(top);

/* ============================================================
   बोतल (LatheGeometry = प्रोफ़ाइल को घुमाकर 3D आकार)
   ============================================================ */
const bottle = new THREE.Group();
scene.add(bottle);

const NECK_TOP = 4.42;
const profilePts = [
  [0.00, 0.00], [0.50, 0.00], [0.60, 0.05], [0.65, 0.22], [0.66, 0.50],
  [0.66, 2.55], [0.62, 2.85], [0.50, 3.20], [0.34, 3.55], [0.25, 3.82],
  [0.225, 3.95], [0.225, 4.10], [0.28, 4.12], [0.28, 4.17], [0.215, 4.19], [0.215, NECK_TOP],
].map(([r, y]) => new THREE.Vector2(r, y));
const smoothProfile = new THREE.SplineCurve(profilePts).getPoints(140);

const plastic = new THREE.MeshPhysicalMaterial({
  color: 0x8fa6ff, metalness: 0, roughness: 0.06, transparent: true, opacity: 0.14,
  clearcoat: 0.6, clearcoatRoughness: 0.05, envMapIntensity: 0.8, side: THREE.DoubleSide, depthWrite: false,
});
const bottleMesh = new THREE.Mesh(new THREE.LatheGeometry(smoothProfile, 128), plastic);
bottleMesh.renderOrder = 2;
bottle.add(bottleMesh);

/* अंदर की कोला (थोड़ी छोटी प्रोफ़ाइल, ऊपर लेवल पर बंद) */
const LIQUID_LEVEL = 3.5;
const liqPts = smoothProfile.filter(p => p.y < LIQUID_LEVEL).map(p => new THREE.Vector2(Math.max(p.x - 0.025, 0), Math.max(p.y, 0.03)));
liqPts.push(new THREE.Vector2(0, LIQUID_LEVEL));
const liquid = new THREE.Mesh(
  new THREE.LatheGeometry(liqPts, 96),
  new THREE.MeshPhysicalMaterial({ color: 0x2a0c03, roughness: 0.1, metalness: 0.1, clearcoat: 1,
    emissive: 0x2a0a02, emissiveIntensity: 0.5, envMapIntensity: 0.7 })
);
liquid.renderOrder = 1;
bottle.add(liquid);

/* लेबल: कैनवास पर बना टेक्सचर (नीला बैकग्राउंड + लाल/सफ़ेद वेव + PEPSI) */
const labelTex = canvasTex(2048, 640, (g, w, h) => {
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#08166a'); bg.addColorStop(.5, '#0038d6'); bg.addColorStop(1, '#061257');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  // बुलबुलों का पैटर्न
  const r = rng(7);
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(255,255,255,${0.04 + r() * 0.08})`;
    g.beginPath(); g.arc(r() * w, r() * h, 2 + r() * 10, 0, Math.PI * 2); g.fill();
  }
  // वेव पट्टियाँ (period 1024 → लेबल पर बिना जोड़ के लिपटती हैं)
  const wave = (base, thick, amp, color, phase) => {
    g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, base + amp * Math.sin((x / 1024) * Math.PI * 2 + phase));
    for (let x = w; x >= 0; x -= 8) g.lineTo(x, base + thick + amp * Math.sin((x / 1024) * Math.PI * 2 + phase + 0.5));
    g.closePath(); g.fillStyle = color; g.fill();
  };
  wave(450, 34, 46, '#ffffff', 0);
  wave(492, 70, 46, '#e4002b', 0.2);
  wave(70, 14, 30, 'rgba(255,255,255,.85)', 2.4);
  for (const cx of [512, 1536]) {           // टेक्स्ट दो बार → हर तरफ़ से दिखे
    g.save(); g.translate(cx, 330); g.transform(1, 0, -0.18, 1, 0, 0);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `italic 900 165px ${FONT}`;
    g.fillStyle = '#e4002b'; g.fillText('PEPSI', 8, 8);
    g.fillStyle = '#ffffff'; g.fillText('PEPSI', 0, 0);
    g.restore();
    g.textAlign = 'center'; g.fillStyle = '#ffffff';
    g.font = `700 34px ${FONT}`; g.fillText('I C E   C O L D   C O L A', cx, 170);
    g.font = `700 34px ${FONT}`; g.fillText('500 ml', cx, 600);
  }
});
const label = new THREE.Mesh(
  new THREE.CylinderGeometry(0.672, 0.672, 1.55, 128, 1, true),
  new THREE.MeshPhysicalMaterial({ map: labelTex, roughness: 0.25, metalness: 0.15, clearcoat: 0.8 })
);
label.position.y = 1.55;
label.rotation.y = 0;                 // टेक्स्ट कैमरे की तरफ़ रहे (बोतल ख़ुद -90° घूमी है)
bottle.add(label);

/* ढक्कन: नीला, किनारे पर धारियाँ (ridges), ऊपर लोगो */
const cap = new THREE.Group();
const CAP_Y = 4.33;
cap.position.y = CAP_Y;
bottle.add(cap);
{
  const side = new THREE.CylinderGeometry(0.27, 0.27, 0.32, 192, 1, true);
  const pos = side.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), th = Math.atan2(x, z);
    const k = 1 + 0.035 * Math.max(0, Math.sin(th * 48));
    pos.setX(i, x * k); pos.setZ(i, z * k);
  }
  side.computeVertexNormals();
  const capMat = new THREE.MeshPhysicalMaterial({ color: 0x1840e0, roughness: 0.3, metalness: 0.2, clearcoat: 1 });
  cap.add(new THREE.Mesh(side, capMat));
  const topTex = canvasTex(512, 512, (g, w) => {
    g.fillStyle = '#1840e0'; g.fillRect(0, 0, w, w);
    g.strokeStyle = '#fff'; g.lineWidth = 18; g.beginPath(); g.arc(256, 256, 200, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#e4002b'; g.beginPath(); g.arc(256, 256, 150, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `italic 900 120px ${FONT}`; g.fillText('P', 256, 262);
  });
  const lid = new THREE.Mesh(new THREE.CircleGeometry(0.27, 96),
    new THREE.MeshPhysicalMaterial({ map: topTex, roughness: 0.3, clearcoat: 1 }));
  lid.rotation.x = -Math.PI / 2; lid.position.y = 0.16;
  cap.add(lid);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.018, 12, 96), capMat);
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.16; cap.add(ring);
}

/* नीचे की चमकती गोल प्लेट (glow disc) */
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    map: canvasTex(512, 512, (g, w) => {
      const gr = g.createRadialGradient(256, 256, 0, 256, 256, 256);
      gr.addColorStop(0, 'rgba(90,150,255,.9)'); gr.addColorStop(.35, 'rgba(40,80,255,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    }) })
);
glow.rotation.x = -Math.PI / 2; glow.position.y = 0.005;
bottle.add(glow);

/* ============================================================
   पार्टिकल्स: बोतल के अंदर बुलबुले, बौछार, झाग, बैकग्राउंड स्पार्कल
   ============================================================ */
const dummy = new THREE.Object3D();

// 1) अंदर उठते बुलबुले
const BUB = 240, bubR = rng(11);
const bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, roughness: 0, emissive: 0xffd9b0, emissiveIntensity: 0.25 }), BUB);
const bubData = Array.from({ length: BUB }, () => ({ a: bubR() * Math.PI * 2, r: Math.sqrt(bubR()) * 0.5, s: bubR(), sp: 0.5 + bubR(), size: 0.008 + bubR() * 0.02 }));
bottle.add(bubbles);

// 2) ढक्कन खुलते ही बौछार (cola spray)
const SPR = 900, sprR = rng(23);
const spray = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8),
  new THREE.MeshPhysicalMaterial({ color: 0x5a2008, roughness: 0.04, clearcoat: 1, emissive: 0x3a1204, emissiveIntensity: 0.6, envMapIntensity: 1.6 }), SPR);
const sprData = Array.from({ length: SPR }, () => {
  const te = T_POP + 1.8 * Math.pow(sprR(), 2.2);          // ज़्यादातर शुरुआत में निकलते हैं
  const strength = 1 - (te - T_POP) / 2.2;
  const ang = sprR() * Math.PI * 2, rad = 0.25 + sprR() * 1.7;
  return { te, vx: Math.cos(ang) * rad, vz: Math.sin(ang) * rad, vy: 3.5 + sprR() * 5.5 * strength, size: 0.01 + sprR() * 0.03 };
});
bottle.add(spray);

// 3) सफ़ेद झाग
const FOAM = 160, foamR = rng(31);
const foam = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, emissive: 0xffffff, emissiveIntensity: 0.35 }), FOAM);
const foamData = Array.from({ length: FOAM }, () => {
  const v = new THREE.Vector3(foamR() - .5, foamR() * .9, foamR() - .5).normalize();
  return { v, d: 0.1 + foamR() * 0.45, size: 0.02 + foamR() * 0.045, delay: foamR() * 0.4 };
});
bottle.add(foam);
[bubbles, spray, foam].forEach(m => m.frustumCulled = false);   // इंस्टेंस हिलते हैं → culling बंद

// 4) शॉकवेव रिंग
const shock = new THREE.Mesh(new THREE.TorusGeometry(1, 0.008, 8, 128),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
shock.rotation.x = Math.PI / 2; shock.position.y = NECK_TOP;
bottle.add(shock);

// 5) बैकग्राउंड में तैरते स्पार्कल
const SPK = 420, spkR = rng(41);
const spkGeo = new THREE.BufferGeometry();
const spkBase = new Float32Array(SPK * 3);
for (let i = 0; i < SPK; i++) { spkBase[i * 3] = (spkR() - .5) * 24; spkBase[i * 3 + 1] = spkR() * 14 - 3; spkBase[i * 3 + 2] = -3 - spkR() * 10; }
spkGeo.setAttribute('position', new THREE.BufferAttribute(spkBase.slice(), 3));
const sparkles = new THREE.Points(spkGeo, new THREE.PointsMaterial({
  size: 0.07, color: 0x9fc2ff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false,
  map: canvasTex(64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }),
}));
scene.add(sparkles);

/* ============================================================
   रिबन: बोतल के चारों ओर लाल/सफ़ेद/नीली घूमती पट्टियाँ
   ============================================================ */
const ribbons = new THREE.Group();
scene.add(ribbons);
const RIB_SEG = 400, RIB_RAD = 12;
const ribbonDefs = [
  { color: RED,      phase: 0.0, r: 1.35, delay: 0.0 },
  { color: 0xffffff, phase: 2.1, r: 1.55, delay: 0.15 },
  { color: 0x2f7bff, phase: 4.2, r: 1.25, delay: 0.3 },
];
for (const d of ribbonDefs) {
  const pts = [];
  for (let k = 0; k <= 60; k++) {
    const u = k / 60, a = d.phase + u * Math.PI * 2 * 1.6;
    const r = d.r + 0.35 * Math.sin(u * Math.PI * 2 + d.phase);
    pts.push(new THREE.Vector3(Math.cos(a) * r, -0.6 + u * 6.6, Math.sin(a) * r));
  }
  const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), RIB_SEG, 0.04, RIB_RAD, false);
  geo.scale(1, 1, 1);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: d.color, emissive: d.color, emissiveIntensity: 0.9, roughness: 0.3, metalness: 0.3 }));
  mesh.userData = d;
  ribbons.add(mesh);
}

/* ============================================================
   HUD: मोशन-ग्राफ़िक टेक्स्ट (canvas पर, ताकि रिकॉर्डिंग में भी आए)
   ============================================================ */
const hud = new THREE.Scene();
const HUD_H = 1080;
const hudCam = new THREE.OrthographicCamera(-960, 960, 540, -540, -10, 10);

function textPlane(text, { size = 100, weight = 900, italic = true, color = '#fff', shadow = null, spacing = 0, stroke = null } = {}) {
  const S = 2, pad = size * 0.4;
  const font = `${italic ? 'italic ' : ''}${weight} ${size * S}px ${FONT}`;
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const chars = [...text];
  const width = chars.reduce((s, ch) => s + m.measureText(ch).width, 0) + spacing * S * (chars.length - 1);
  const tex = canvasTex(Math.ceil(width + pad * 2 * S), Math.ceil(size * 1.5 * S + pad * S), (g, w, h) => {
    g.font = font; g.textBaseline = 'middle';
    const drawAll = (dx, dy, fill) => { let x = pad * S + dx; g.fillStyle = fill;
      for (const ch of chars) { if (stroke) { g.lineWidth = stroke.w * S; g.strokeStyle = stroke.color; g.strokeText(ch, x, h / 2 + dy); }
        g.fillText(ch, x, h / 2 + dy); x += m.measureText(ch).width + spacing * S; } };
    if (shadow) drawAll(shadow.x * S, shadow.y * S, shadow.color);
    drawAll(0, 0, color);
  });
  const w = tex.image.width / S, h = tex.image.height / S;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, depthTest: false }));
  mesh.userData.w = w;
  hud.add(mesh);
  return mesh;
}
function rectPlane(color, w, h) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color, transparent: true, toneMapped: false, depthTest: false }));
  hud.add(mesh); return mesh;
}

const txtTwist  = textPlane('TWIST  IT', { size: 54, spacing: 14, weight: 800 });
const txtPsst   = textPlane('PSSHHH!', { size: 190, shadow: { x: 10, y: 10, color: '#e4002b' }, stroke: { w: 6, color: '#0a1a6e' } });
const wipeRed   = rectPlane(RED, 520, 3000);
const wipeBlue  = rectPlane(0x0d3be0, 520, 3000);
const wipeWhite = rectPlane(0xffffff, 120, 3000);
const txtBrand  = textPlane('PEPSI', { size: 250, shadow: { x: 12, y: 12, color: '#e4002b' } });
const txtTag    = textPlane('OPEN THE FIZZ', { size: 72, spacing: 10, weight: 900 });
const barTag    = rectPlane(RED, 1, 10);
const txtSub    = textPlane('Ice cold  ·  Bold taste  ·  Zero limits', { size: 34, italic: false, weight: 600, color: '#cfe0ff' });
const txtHash   = textPlane('#OpenTheFizz', { size: 30, italic: false, weight: 700, color: '#ffffff' });
const flash     = rectPlane(0xffffff, 6000, 3000);
const fade      = rectPlane(0x000000, 6000, 3000);
[txtTwist, txtPsst, txtBrand, txtTag, txtSub, txtHash].forEach(m => m.renderOrder = 5);
flash.renderOrder = 8; fade.renderOrder = 9;

/* ============================================================
   पोस्ट-प्रोसेसिंग (Bloom = चमक)
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.45, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

let HUD_W = 1920;
function resize(w = innerWidth, h = innerHeight) {
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  HUD_W = HUD_H * camera.aspect;
  Object.assign(hudCam, { left: -HUD_W / 2, right: HUD_W / 2, top: HUD_H / 2, bottom: -HUD_H / 2 });
  hudCam.updateProjectionMatrix();
}

/* ============================================================
   कैमरा की-फ़्रेम्स: [समय, कोण, दूरी, ऊँचाई, टारगेट x, टारगेट y]
   ============================================================ */
const camKeys = [
  [0.0, -0.9, 9.0, 0.8, 0.0, 1.8],
  [2.0, -0.2, 5.2, 3.3, 0.0, 3.0],
  [2.7,  0.15, 2.1, 4.65, 0.0, 4.25],
  [3.8,  0.35, 1.75, 4.55, 0.0, 4.3],
  [4.7,  0.1, 6.8, 3.1, 0.0, 4.7],
  [6.8, -0.15, 7.4, 2.7, 0.0, 3.3],
  [8.0,  0.25, 7.8, 2.5, -1.35, 2.35],
  [12.0, 0.02, 7.0, 2.6, -1.35, 2.35],
];
const camTarget = new THREE.Vector3();
function cameraAt(t) {
  let i = 0; while (i < camKeys.length - 2 && t > camKeys[i + 1][0]) i++;
  const A = camKeys[i], B = camKeys[i + 1];
  const k = easeInOutCubic(range(t, A[0], B[0]));
  const ang = lerp(A[1], B[1], k), dist = lerp(A[2], B[2], k), hgt = lerp(A[3], B[3], k);
  const portrait = camera.aspect < 1;
  camTarget.set(portrait ? 0 : lerp(A[4], B[4], k), lerp(A[5], B[5], k), 0);
  camera.position.set(Math.sin(ang) * dist * (portrait ? 1.6 : 1), hgt, Math.cos(ang) * dist * (portrait ? 1.6 : 1));
  if (portrait) camera.position.y += 1;
  // ढक्कन उछलने पर कैमरा शेक
  const dt = t - T_POP;
  if (dt > 0) {
    const s = 0.09 * Math.exp(-dt * 4);
    camera.position.x += Math.sin(dt * 71) * s; camera.position.y += Math.sin(dt * 53 + 1) * s;
  }
  camera.lookAt(camTarget);
}

/* ============================================================
   मुख्य टाइमलाइन: समय t पर पूरा सीन सेट करो (deterministic)
   ============================================================ */
function update(t) {
  const dtPop = t - T_POP;

  // बोतल नीचे से ऊपर आती है और घूमते हुए रुकती है
  const rise = easeOutCubic(range(t, 0, 1.8));
  bottle.position.y = lerp(-4.8, 0, rise);
  bottle.rotation.y = -Math.PI / 2 - lerp(Math.PI * 2, 0, rise) + (t > 7 ? Math.sin((t - 7) * 0.6) * 0.25 : 0);
  bottle.rotation.z = lerp(0.25, 0, rise) + (dtPop > 0 ? Math.sin(dtPop * 30) * 0.03 * Math.exp(-dtPop * 5) : 0);

  // ढक्कन: घूमकर खुलता है → फिर उछलकर उड़ जाता है
  const twist = easeInOutCubic(range(t, 2.3, T_POP));
  if (dtPop <= 0) {
    cap.visible = true;
    cap.position.set(0, CAP_Y + twist * 0.09, 0);
    cap.rotation.set(0, twist * Math.PI * 3.5, 0);
  } else {
    cap.visible = dtPop < 2.5;
    cap.position.set(0.7 * dtPop, CAP_Y + 0.09 + 7.5 * dtPop - 4.5 * dtPop * dtPop, 1.1 * dtPop);
    cap.rotation.set(9 * dtPop, Math.PI * 3.5 + 12 * dtPop, 5 * dtPop);
  }

  // कोला लेवल थोड़ा कम होता है
  liquid.scale.y = 1 - 0.07 * easeOutCubic(range(t, T_POP, T_POP + 2));

  // अंदर के बुलबुले: पॉप के बाद तेज़
  const fizz = 0.06 + 0.9 * easeOutCubic(range(t, T_POP - 0.2, T_POP + 0.6)) * (1 - 0.5 * range(t, 8, 12));
  const timeFizz = t * 0.06 + Math.max(0, dtPop) * fizz;
  for (let i = 0; i < BUB; i++) {
    const b = bubData[i];
    const y = 0.1 + ((b.s + timeFizz * b.sp) % 1) * (LIQUID_LEVEL * liquid.scale.y - 0.15);
    const prof = y > 2.6 ? lerp(1, 0.4, range(y, 2.6, 3.5)) : 1;
    dummy.position.set(Math.cos(b.a + y) * b.r * prof, y, Math.sin(b.a + y) * b.r * prof);
    dummy.scale.setScalar(b.size * (t > 0.5 ? 1 : 0));
    dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix);
  }
  bubbles.instanceMatrix.needsUpdate = true;

  // बौछार (साधारण फिज़िक्स: p = p0 + v·t + ½·g·t²)
  for (let i = 0; i < SPR; i++) {
    const p = sprData[i], d = t - p.te;
    if (d <= 0 || d > 2.4) { dummy.scale.setScalar(0); }
    else {
      dummy.position.set(p.vx * d, NECK_TOP + p.vy * d - 4.9 * d * d, p.vz * d);
      const vy = p.vy - 9.8 * d;
      dummy.scale.set(p.size, p.size * (1 + Math.min(Math.abs(vy) * 0.25, 2.5)), p.size);
      dummy.scale.multiplyScalar(1 - range(d, 1.8, 2.4));
    }
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix(); spray.setMatrixAt(i, dummy.matrix);
  }
  spray.instanceMatrix.needsUpdate = true;

  // झाग: गर्दन पर फूलता है
  for (let i = 0; i < FOAM; i++) {
    const f = foamData[i], d = dtPop - f.delay;
    if (d <= 0 || d > 3.2) dummy.scale.setScalar(0);
    else {
      const grow = easeOutCubic(range(d, 0, 0.8));
      dummy.position.copy(f.v).multiplyScalar(f.d * grow * 0.7);
      dummy.position.y += NECK_TOP + 0.02 + d * 0.12;
      dummy.scale.setScalar(f.size * grow * (1 - range(d, 2.2, 3.2)));
    }
    dummy.updateMatrix(); foam.setMatrixAt(i, dummy.matrix);
  }
  foam.instanceMatrix.needsUpdate = true;

  // शॉकवेव
  const sk = range(dtPop, 0, 0.7);
  shock.visible = dtPop > 0 && sk < 1 && camera.position.y > NECK_TOP + 0.6;   // सिर्फ़ ऊपर से दिखने पर
  shock.scale.setScalar(0.3 + easeOutCubic(sk) * 3.2);
  shock.material.opacity = (1 - sk) * 0.45;

  // रिबन: धीरे-धीरे बनते हैं और घूमते हैं
  for (const m of ribbons.children) {
    const d = m.userData;
    const p = easeInOutCubic(range(t, T_POP + 0.3 + d.delay, 7.0 + d.delay));
    const tail = 0.35 * easeInOutCubic(range(t, 9.5, 12));
    const start = Math.floor(tail * RIB_SEG) * RIB_RAD * 6;
    m.geometry.setDrawRange(start, Math.max(0, Math.floor(p * RIB_SEG) * RIB_RAD * 6 - start));
  }
  ribbons.rotation.y = t * 0.45;
  ribbons.position.y = bottle.position.y;

  // स्पार्कल ऊपर तैरते हैं
  const sp = spkGeo.attributes.position;
  for (let i = 0; i < SPK; i++) sp.array[i * 3 + 1] = ((spkBase[i * 3 + 1] + 3 + t * (0.25 + (i % 7) * 0.05)) % 14) - 3;
  sp.needsUpdate = true;

  // रिम लाइट पल्स
  rimRed.intensity = 60 + (dtPop > 0 ? 160 * Math.exp(-dtPop * 3) : 0);
  bloom.strength = 0.5 + (dtPop > 0 ? 0.9 * Math.exp(-dtPop * 3) : 0);

  cameraAt(t);
  updateHUD(t);
}

function updateHUD(t) {
  const dtPop = t - T_POP;
  const L = -HUD_W / 2, portrait = camera.aspect < 1;

  // "TWIST IT"
  txtTwist.position.set(0, -400, 0);
  txtTwist.material.opacity = range(t, 2.4, 2.8) * (1 - range(t, 3.5, 3.8));
  txtTwist.scale.setScalar(1 + range(t, 2.4, 3.8) * 0.08);

  // "PSSHHH!" पॉप
  const pk = range(dtPop, 0, 0.45);
  txtPsst.visible = dtPop > 0 && dtPop < 1.6;
  txtPsst.scale.setScalar(Math.max(0.001, easeOutBack(pk)) * (portrait ? 0.55 : 1) * (1 + dtPop * 0.06));
  txtPsst.rotation.z = -0.08 + Math.sin(dtPop * 40) * 0.02 * Math.exp(-dtPop * 6);
  txtPsst.position.set(0, 300, 0);
  txtPsst.material.opacity = 1 - range(dtPop, 1.2, 1.6);

  // फ़्लैश
  flash.material.opacity = dtPop > 0 ? 0.4 * Math.exp(-dtPop * 10) : 0;

  // डायगोनल वाइप ट्रांज़िशन
  const wipe = (mesh, a, b) => {
    const k = easeInOutCubic(range(t, a, b));
    mesh.visible = k > 0 && k < 1;
    mesh.rotation.z = 0.38;
    mesh.position.set(lerp(-HUD_W / 2 - 900, HUD_W / 2 + 900, k), 0, 0);
  };
  wipe(wipeRed, 6.55, 7.35); wipe(wipeWhite, 6.65, 7.45); wipe(wipeBlue, 6.75, 7.55);

  // हीरो टाइटल
  const tx = portrait ? 0 : L + 120;
  const bk = easeOutCubic(range(t, 7.5, 8.3));
  txtBrand.position.set((portrait ? 0 : tx + txtBrand.userData.w / 2) - (1 - bk) * 260, portrait ? 360 : 120, 0);
  txtBrand.material.opacity = bk;
  txtBrand.scale.setScalar(portrait ? 0.6 : 1);

  const tk = easeOutCubic(range(t, 8.1, 8.8));
  txtTag.position.set((portrait ? 0 : tx + txtTag.userData.w / 2 + 6) - (1 - tk) * 140, portrait ? 220 : -55, 0);
  txtTag.material.opacity = tk;
  txtTag.scale.setScalar(portrait ? 0.7 : 1);

  const bw = easeInOutCubic(range(t, 8.7, 9.4)) * (portrait ? 420 : 560);
  barTag.scale.set(Math.max(bw, 0.001), 1, 1);
  barTag.position.set((portrait ? 0 : tx + 30 + bw / 2), portrait ? 160 : -120, 0);
  if (portrait) barTag.position.x = 0;

  const sk = easeOutCubic(range(t, 9.0, 9.7));
  txtSub.position.set((portrait ? 0 : tx + txtSub.userData.w / 2 + 14), (portrait ? 110 : -175) - (1 - sk) * 30, 0);
  txtSub.material.opacity = sk;
  txtSub.scale.setScalar(portrait ? 0.75 : 1);

  txtHash.position.set(portrait ? 0 : HUD_W / 2 - txtHash.userData.w / 2 - 50, -HUD_H / 2 + 60, 0);
  txtHash.material.opacity = range(t, 9.6, 10.3) * 0.9;

  // शुरुआत और अंत का फ़ेड
  fade.material.opacity = Math.max(1 - range(t, 0, 0.6), range(t, DURATION - 0.6, DURATION));
}

function render() {
  renderer.clear();
  composer.render();
  renderer.clearDepth();
  renderer.render(hud, hudCam);
}

/* ============================================================
   प्लेबैक / रिकॉर्डिंग
   ============================================================ */
if (RENDER_MODE) {
  // वीडियो एक्सपोर्ट (render.cjs) के लिए: window.__renderAt(t)
  resize(+params.get('w') || 1920, +params.get('h') || 1080);
  window.__renderAt = (t) => { update(t); render(); };
  document.fonts.ready.then(() => { window.__ready = true; });
} else {
  resize();
  addEventListener('resize', () => resize());
  const $ = id => document.getElementById(id);
  let t = 0, playing = true, last = performance.now(), recorder = null;

  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Pause' : '▶ Play'; };
  $('replay').onclick = () => { t = 0; playing = true; $('play').textContent = '⏸ Pause'; };
  $('scrub').oninput = e => { t = +e.target.value; playing = false; $('play').textContent = '▶ Play'; };

  // ब्राउज़र में ही WebM वीडियो रिकॉर्ड करो (canvas.captureStream + MediaRecorder)
  $('record').onclick = () => {
    if (recorder) return;
    const stream = renderer.domElement.captureStream(60);
    const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 12e6 });
    const chunks = [];
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = 'pepsi-3d-motion.webm'; a.click();
      recorder = null; $('record').textContent = '⏺ Record';
    };
    t = 0; playing = true; $('play').textContent = '⏸ Pause';
    $('record').textContent = '● Recording…';
    recorder.start();
  };

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (playing) {
      t += dt;
      if (t >= DURATION) { if (recorder) { recorder.stop(); playing = false; t = DURATION; } else t = 0; }
    }
    $('scrub').value = t; $('time').textContent = t.toFixed(2);
    update(t); render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
